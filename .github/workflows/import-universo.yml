name: Importar Universo IF Avalia

on:
  push:
    branches:
      - feat/universo-if-avalia-mvp
    paths:
      - .github/workflows/import-universo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: feat/universo-if-avalia-mvp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair pacote versionado
        shell: bash
        run: |
          test -f Universo-IF-Avalia-MVP.zip
          mkdir -p /tmp/universo-pacote
          unzip -q Universo-IF-Avalia-MVP.zip -d /tmp/universo-pacote
          test -d /tmp/universo-pacote/universo-if-avalia
          cp -a /tmp/universo-pacote/universo-if-avalia/. .
          if [ -f .gitignore ]; then
            printf '\n# Regras do Universo IF Avalia\n' >> .gitignore
            cat /tmp/universo-pacote/universo-if-avalia/.gitignore >> .gitignore
          fi

      - name: Registrar fontes na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar fontes do Universo IF Avalia MVP"
            git push origin HEAD:feat/universo-if-avalia-mvp
          fi

      - name: Instalar dependências e validar
        run: npm install --no-audit --no-fund

      - name: Testes automatizados
        run: npm test

      - name: Validar catálogo
        run: node scripts/validar_catalogo.mjs

      - name: Verificar sintaxe do Apps Script
        run: node --check < backend/Code.gs

      - name: Compilar aplicação
        run: npm run build
