name: Build and deploy GitHub Pages
# Temporary Pages deployment for QA is allowed from the team feature branch and main.
on:
  push:
    branches: [main, feat/universo-if-avalia-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/validar_catalogo.mjs
      - run: node --check < backend/Code.gs
      - name: Confirmar gateway de produção e votação fechada
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/universo-if-avalia-mvp')
        env:
          GATEWAY: ${{ vars.VITE_AVALIA_GATEWAY_URL }}
          QA_GATEWAY: https://universo-if-avalia-qa.rayssagabriela.workers.dev
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const gateway = new URL(process.env.GATEWAY);
          assert.equal(gateway.protocol, 'https:');
          assert.equal(gateway.href, gateway.origin + '/');
          assert.notEqual(gateway.origin, process.env.QA_GATEWAY);
          const origin = 'https://rayssa-gm.github.io';
          async function read(path) {
            const response = await fetch(new URL(path, gateway), {
              headers: { Origin: origin }, redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            assert(response.ok, 'API de produção indisponível');
            assert.equal(response.headers.get('access-control-allow-origin'), origin);
            const envelope = await response.json();
            assert.equal(envelope.ok, true);
            return envelope.data;
          }
          const bootstrap = await read('/bootstrap');
          assert.equal(bootstrap.status, 'FECHADA');
          assert.equal(bootstrap.minRanking, 5);
          for (const [modality, total] of [['Mostra Nacional', 24], ['Mostra de Extensão', 22]]) {
            const ranking = await read('/ranking?' + new URLSearchParams({ modalidade: modality }));
            assert.equal(ranking.modality, modality);
            assert.equal(ranking.minimum, 5);
            assert.equal(ranking.items.length, total);
            assert.equal(new Set(ranking.items.map(item => item.id)).size, total);
            assert(ranking.items.every(item => item.modalidade === modality));
          }
          JS
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_AVALIA_GATEWAY_URL: ${{ vars.VITE_AVALIA_GATEWAY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/universo-if-avalia-mvp'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
