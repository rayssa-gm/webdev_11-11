name: Runtime ranking homologation

on:
  push:
    branches:
      - feat/universo-if-avalia-mvp
    paths:
      - '.github/workflows/ranking-homologation.yml'
      - 'scripts/probe_ranking.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Verify connected ranking in real runtime
        run: node scripts/probe_ranking.mjs
