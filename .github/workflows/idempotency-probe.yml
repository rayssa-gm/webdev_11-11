name: Runtime idempotency probe

on:
  push:
    branches:
      - feat/universo-if-avalia-mvp
    paths:
      - '.github/workflows/idempotency-probe.yml'
      - 'scripts/probe_idempotency.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Apps Script idempotency in real runtime
        run: node scripts/probe_idempotency.mjs
